name: "Bug report"
description: "Report a reproducible problem with LEVENLOOS Discord Bot."
title: "[Bug]: "
labels:
  - "bug"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "Report problems with **LEVENLOOS Discord Bot** here. Check the [README](https://github.com/Mikaaah/Levenloos-Bot#readme) and existing reports first. Use the feature form for new ideas."
  -
    type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        -
          label: "I searched existing issues and checked the project README."
          required: true
        -
          label: "I removed tokens, passwords, personal data and private server details from my report and attachments."
          required: true
  -
    type: "dropdown"
    id: "area"
    attributes:
      label: "Affected area"
      options:
        - "Startup / deployment"
        - "Moderation / permissions"
        - "Reaction roles"
        - "Temporary voice channels"
        - "Leveling"
        - "Reminders / notifications"
        - "Panels / commands"
        - "Documentation"
        - "Other"
    validations:
      required: true
  -
    type: "textarea"
    id: "versions"
    attributes:
      label: "Versions and environment"
      description: "Commit or bot version, Python and discord.py versions, operating system and whether this is a test server. Never include your bot token."
    validations:
      required: true
  -
    type: "textarea"
    id: "behavior"
    attributes:
      label: "Expected and actual behavior"
      description: "Describe what you expected and what happened."
    validations:
      required: true
  -
    type: "textarea"
    id: "reproduce"
    attributes:
      label: "Steps to reproduce"
      description: "Give numbered steps and a minimal example where possible."
    validations:
      required: true
  -
    type: "textarea"
    id: "logs"
    attributes:
      label: "Logs and screenshots"
      description: "Attach relevant logs or screenshots. Remove private information before uploading."
  -
    type: "textarea"
    id: "isolation"
    attributes:
      label: "Compatibility and additional context"
      description: "List relevant mods, integrations or configuration changes. Note whether a minimal setup reproduces the issue."
